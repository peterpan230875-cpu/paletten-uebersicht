<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paletten Inventur</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(ellipse at center, #1a2a3a 0%, #0f1820 100%);
            min-height: 100svh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .container { max-width: 500px; width: 100%; }

        /* ===== CARD ===== */
        .card {
            background: #1a2538;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            height: 88svh;
            max-height: 820px;
            display: flex;
            flex-direction: column;
        }

        .card::before {
            content: '';
            height: 6px;
            background: linear-gradient(90deg, #FF6B4A, #FF8C42, #FFD700);
            flex-shrink: 0;
        }

        /* ===== HEADER ===== */
        .card-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .header-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #FF6B4A, #FF8C42);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }

        .header-title { font-size: 17px; font-weight: 700; color: white; }
        .header-subtitle { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }

        .summary-btn {
            background: rgba(255,107,74,0.15);
            border: 1px solid rgba(255,107,74,0.35);
            color: #FF8C42;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            white-space: nowrap;
        }
        .summary-btn:hover { background: rgba(255,107,74,0.25); }

        /* ===== CONTENT ===== */
        .card-content {
            flex: 1; overflow-y: auto; padding: 0 18px 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== MIC ===== */
        .mic-section {
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 0 14px;
        }

        #micBtn {
            width: 100px; height: 100px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #51cf66, #37b24d);
            cursor: pointer; font-size: 0; transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(81,207,102,0.3);
        }
        #micBtn::before { content: '🎤'; font-size: 42px; }

        #micBtn.recording {
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            box-shadow: 0 8px 24px rgba(255,107,107,0.4);
            animation: micPulse 1.4s ease-in-out infinite;
        }
        #micBtn.processing {
            background: linear-gradient(135deg, #FF8C42, #FF6B4A);
            box-shadow: 0 8px 24px rgba(255,140,66,0.3);
        }
        #micBtn.processing::before { content: '⏳'; }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); box-shadow: 0 12px 32px rgba(255,107,107,0.6); }
        }

        #status {
            margin-top: 10px; font-size: 13px;
            color: rgba(255,255,255,0.55); text-align: center; min-height: 18px;
        }

        /* ===== PALETTE LIST ===== */
        .section-label {
            font-size: 10px; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; color: rgba(255,255,255,0.35);
            margin: 4px 0 10px;
        }

        #palettenListe { display: flex; flex-direction: column; gap: 7px; }

        .palette-row {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 11px 14px;
            display: flex; align-items: center; gap: 10px;
        }

        .palette-name { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.88); flex: 1; }
        .palette-count { font-size: 20px; font-weight: 800; color: #FF8C42; min-width: 36px; text-align: right; }

        .palette-edit-btn {
            background: rgba(255,255,255,0.07); border: none;
            color: rgba(255,255,255,0.35); border-radius: 6px;
            width: 28px; height: 28px; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center; padding: 28px 16px;
            color: rgba(255,255,255,0.28); font-size: 13px; line-height: 1.7;
        }
        .empty-icon { font-size: 38px; display: block; margin-bottom: 10px; }

        /* ===== BOTTOM BUTTONS ===== */
        .bottom-actions { display: flex; gap: 10px; margin-top: 14px; }

        .btn-outline {
            flex: 1; padding: 11px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.65);
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.09); color: white; }

        .btn-danger-outline {
            flex: 1; padding: 11px; border-radius: 10px;
            border: 1px solid rgba(255,100,100,0.25);
            background: rgba(255,100,100,0.06);
            color: rgba(255,140,140,0.75);
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }

        .version { text-align: center; font-size: 10px; color: rgba(255,255,255,0.18); padding-top: 10px; }

        /* ===== TOAST ===== */
        #toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #243048; border: 1px solid rgba(255,107,74,0.4);
            border-radius: 12px; padding: 11px 20px;
            font-size: 14px; font-weight: 600; color: white;
            z-index: 500; transition: transform 0.3s ease;
            max-width: calc(100% - 40px); text-align: center; white-space: nowrap;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { border-color: rgba(81,207,102,0.5); }
        #toast.error { border-color: rgba(255,107,107,0.5); }

        /* ===== OVERLAY BASE ===== */
        .overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.72);
            align-items: center; justify-content: center; padding: 16px;
        }
        .overlay.visible { display: flex; }

        .overlay-card {
            background: #1a2538; border-radius: 20px; overflow: hidden;
            width: 100%; max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .overlay-card::before {
            content: ''; display: block; height: 6px;
            background: linear-gradient(90deg, #FF6B4A, #FF8C42, #FFD700);
        }
        .overlay-card.scrollable { max-height: 88svh; display: flex; flex-direction: column; }

        .overlay-header {
            padding: 16px 20px; display: flex; align-items: center;
            justify-content: space-between; flex-shrink: 0;
        }
        .overlay-header-left { display: flex; align-items: center; gap: 10px; }
        .overlay-title { font-size: 16px; font-weight: 700; color: white; }
        .overlay-subtitle { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }

        .close-btn {
            background: rgba(255,255,255,0.09); border: none;
            color: rgba(255,255,255,0.55); border-radius: 8px;
            padding: 6px 12px; cursor: pointer; font-size: 13px;
        }

        .overlay-content { padding: 0 20px 20px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

        /* ===== SUMMARY ===== */
        .summary-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .summary-row:last-child { border-bottom: none; }
        .summary-name { font-size: 15px; color: rgba(255,255,255,0.82); font-weight: 500; }
        .summary-count { font-size: 20px; font-weight: 800; color: #FF8C42; }

        .total-row {
            margin-top: 14px; padding: 13px 16px;
            background: rgba(255,107,74,0.1); border: 1px solid rgba(255,107,74,0.22);
            border-radius: 10px; display: flex; align-items: center; justify-content: space-between;
        }
        .total-label { font-size: 14px; font-weight: 700; color: #FF8C42; }
        .total-count { font-size: 26px; font-weight: 900; color: #FF8C42; }

        .overlay-actions { display: flex; gap: 10px; margin-top: 16px; }

        .btn-primary {
            flex: 1; padding: 13px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #FF6B4A, #FF8C42);
            color: white; font-size: 14px; font-weight: 700; cursor: pointer;
        }

        /* ===== MANUAL INPUT ===== */
        .form-label {
            display: block; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: rgba(255,255,255,0.45); margin-bottom: 6px; margin-top: 14px;
        }

        select, input[type="number"] {
            width: 100%; padding: 11px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 8px; color: white; font-size: 16px;
            -webkit-appearance: none;
        }
        select option { background: #1a2538; }
        input[type="number"]:focus, select:focus {
            outline: none; border-color: #FF8C42;
        }

        .action-toggle { display: flex; gap: 8px; margin-top: 6px; }

        .action-btn {
            flex: 1; padding: 10px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .action-btn.active-add { border-color: #51cf66; background: rgba(81,207,102,0.12); color: #51cf66; }
        .action-btn.active-remove { border-color: #ff6b6b; background: rgba(255,107,107,0.12); color: #ff6b6b; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 8px; align-items: flex-start; }
            .card { height: 96svh; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- MAIN CARD -->
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="header-left">
                    <div class="header-icon">📦</div>
                    <div>
                        <div class="header-title">Paletten Inventur</div>
                        <div class="header-subtitle" id="headerCount">Bereit</div>
                    </div>
                </div>
                <button class="summary-btn" onclick="zeigeSummary()">📊 Übersicht</button>
            </div>

            <div class="card-content">
                <!-- MIC -->
                <div class="mic-section">
                    <button id="micBtn" onclick="toggleRecording()"></button>
                    <p id="status">Tippe um zu sprechen</p>
                </div>

                <!-- LIST -->
                <div class="section-label" id="listLabel" style="display:none">Gezählte Paletten</div>
                <div id="palettenListe">
                    <div class="empty-state">
                        <span class="empty-icon">🏭</span>
                        Noch keine Paletten gezählt.<br>
                        Tippe auf den Kreis und sprich,<br>
                        z.B. „15 Europaletten"
                    </div>
                </div>

                <!-- BOTTOM ACTIONS -->
                <div class="bottom-actions" id="bottomActions" style="display:none">
                    <button class="btn-outline" onclick="oeffneManual()">✏️ Manuell</button>
                    <button class="btn-danger-outline" onclick="neueInventur()">🗑️ Neu starten</button>
                </div>

                <div class="version">V2.0</div>
            </div>
        </div>
    </div>

    <!-- SUMMARY OVERLAY -->
    <div id="summaryOverlay" class="overlay">
        <div class="overlay-card scrollable">
            <div class="overlay-header">
                <div class="overlay-header-left">
                    <div class="header-icon">📊</div>
                    <div>
                        <div class="overlay-title">Zusammenfassung</div>
                        <div class="overlay-subtitle" id="summarySubtitle"></div>
                    </div>
                </div>
                <button class="close-btn" onclick="schliesseSummary()">✕</button>
            </div>
            <div class="overlay-content">
                <div id="summaryListe"></div>
                <div class="overlay-actions">
                    <button class="btn-outline" onclick="kopiereErgebnis()">📋 Kopieren</button>
                    <button class="btn-primary" onclick="schliesseSummary()">← Zurück</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MANUAL INPUT OVERLAY -->
    <div id="manualOverlay" class="overlay">
        <div class="overlay-card">
            <div class="overlay-header">
                <div class="overlay-title">✏️ Manuell hinzufügen</div>
                <button class="close-btn" onclick="schliesseManual()">✕</button>
            </div>
            <div class="overlay-content">
                <label class="form-label">Palettenart</label>
                <select id="manualType"></select>

                <label class="form-label">Aktion</label>
                <div class="action-toggle">
                    <button id="actionAdd" class="action-btn active-add" onclick="setAction('add')">➕ Hinzufügen</button>
                    <button id="actionRemove" class="action-btn" onclick="setAction('remove')">➖ Abziehen</button>
                </div>

                <label class="form-label">Anzahl</label>
                <input type="number" id="manualQty" min="1" value="1">

                <div style="margin-top:16px;">
                    <button class="btn-primary" onclick="speichereManual()" style="width:100%">✅ Übernehmen</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // PALETTENARTEN
        // ============================================
        const PALETTENARTEN = [
            'Europalette','Europalette 2','Europalette 3',
            'Gitterbox','Steinzeug Gitterbox',
            'Ziegelpalette','Gipskartonpalette','Fermacellpalette',
            'MUHR-Palette','Steinzeugpalette','Steinzeugpalette klein',
            'Steinzeugpalette groß','EHL-Palette','Eder-Palette',
            'Limex-Palette','KS-Palette','Porenbetonpalette',
            'KB-Palette','Velux-Palette','Spezialpalette','Grafepalette'
        ];

        // Lokaler Fallback-Parser (Synonyme)
        const SYNONYME = {
            'euro':'Europalette','europalette':'Europalette','europool':'Europalette','epal':'Europalette',
            'gitterbox':'Gitterbox','gkr':'Gitterbox',
            'gipskarton':'Gipskartonpalette','gkb':'Gipskartonpalette',
            'fermacell':'Fermacellpalette','fels':'Fermacellpalette',
            'muhr':'MUHR-Palette',
            'steinzeug':'Steinzeugpalette','stg':'Steinzeugpalette',
            'ks':'KS-Palette','kalksandstein':'KS-Palette',
            'porenbeton':'Porenbetonpalette','ytong':'Porenbetonpalette','gasbeton':'Porenbetonpalette',
            'klinker':'KB-Palette','kb':'KB-Palette',
            'velux':'Velux-Palette',
            'ehl':'EHL-Palette','eder':'Eder-Palette','limex':'Limex-Palette',
            'ziegel':'Ziegelpalette','ziegelpalette':'Ziegelpalette',
            'grafe':'Grafepalette','grafepalette':'Grafepalette',
            'spezial':'Spezialpalette'
        };

        // ============================================
        // STATE
        // ============================================
        let inventur = {};
        let isRecording = false;
        let isProcessing = false;
        let manualAction = 'add';

        // ============================================
        // LOCALSTORAGE
        // ============================================
        function ladeInventur() {
            try {
                const saved = localStorage.getItem('palettenInventur_v2');
                if (saved) inventur = JSON.parse(saved);
            } catch (e) {}
            aktualisiereAnzeige();
        }

        function speichereInventur() {
            try { localStorage.setItem('palettenInventur_v2', JSON.stringify(inventur)); } catch (e) {}
        }

        // ============================================
        // ANZEIGE
        // ============================================
        function aktualisiereAnzeige() {
            const liste = document.getElementById('palettenListe');
            const label = document.getElementById('listLabel');
            const actions = document.getElementById('bottomActions');
            const headerCount = document.getElementById('headerCount');

            const eintraege = Object.entries(inventur)
                .filter(([, v]) => v > 0)
                .sort((a, b) => b[1] - a[1]);

            if (eintraege.length === 0) {
                liste.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon">🏭</span>
                        Noch keine Paletten gezählt.<br>
                        Tippe auf den Kreis und sprich,<br>
                        z.B. „15 Europaletten"
                    </div>`;
                label.style.display = 'none';
                actions.style.display = 'none';
                headerCount.textContent = 'Bereit';
            } else {
                const total = eintraege.reduce((s, [, v]) => s + v, 0);
                label.style.display = 'block';
                actions.style.display = 'flex';
                headerCount.textContent = `${eintraege.length} Arten · ${total} gesamt`;

                liste.innerHTML = eintraege.map(([name, count]) => `
                    <div class="palette-row">
                        <span class="palette-name">${escapeHtml(name)}</span>
                        <span class="palette-count">${count}</span>
                        <button class="palette-edit-btn" onclick="bearbeiteEintrag('${escapeAttr(name)}')">✏️</button>
                    </div>
                `).join('');
            }
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = String(text);
            return d.innerHTML;
        }

        function escapeAttr(text) {
            return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        // ============================================
        // TOAST
        // ============================================
        let toastTimer;
        function zeigeToast(text, typ) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.className = 'show' + (typ ? ' ' + typ : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
        }

        // ============================================
        // AUFNAHME
        // ============================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        function toggleRecording() {
            if (isProcessing) return;
            isRecording ? stoppeAufnahme() : starteAufnahme();
        }

        function starteAufnahme() {
            if (!SpeechRecognition) {
                zeigeToast('❌ Spracherkennung nicht unterstützt', 'error');
                return;
            }

            try {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'de-DE';
            } catch (e) {
                zeigeToast('❌ Mikrofon-Fehler', 'error');
                return;
            }

            recognition.onresult = async (e) => {
                const text = e.results[0][0].transcript.trim();
                console.log('Erkannt:', text);
                setzeStatus('💬 "' + text + '"');
                await verarbeiteText(text);
            };

            recognition.onerror = (e) => {
                console.error('Fehler:', e.error);
                if (e.error !== 'no-speech') zeigeToast('❌ ' + e.error, 'error');
                setzeMicStatus('idle');
                setzeStatus('Tippe um zu sprechen');
                isRecording = false;
            };

            recognition.onend = () => {
                isRecording = false;
                if (!isProcessing) {
                    setzeMicStatus('idle');
                    setzeStatus('Tippe um zu sprechen');
                }
            };

            try {
                recognition.start();
                isRecording = true;
                setzeMicStatus('recording');
                setzeStatus('🎤 Spreche jetzt...');
            } catch (e) {
                zeigeToast('❌ Mikrofon-Fehler', 'error');
            }
        }

        function stoppeAufnahme() {
            if (recognition) { try { recognition.stop(); } catch (e) {} }
            isRecording = false;
        }

        function setzeMicStatus(s) {
            document.getElementById('micBtn').className = s === 'idle' ? '' : s;
        }

        function setzeStatus(text) {
            document.getElementById('status').textContent = text;
        }

        // ============================================
        // GROQ PARSING
        // ============================================
        async function verarbeiteText(text) {
            isProcessing = true;
            setzeMicStatus('processing');
            setzeStatus('⏳ Verarbeite...');

            let paletten = [];
            let groqOk = false;

            try {
                const res = await fetch('/api/parse-palette', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.success && data.paletten?.length > 0) {
                    paletten = data.paletten.filter(p => p.palettenart && p.anzahl > 0);
                    groqOk = true;
                }
            } catch (e) {
                console.warn('Groq nicht erreichbar, nutze Fallback');
            }

            // Lokaler Fallback
            if (!groqOk || paletten.length === 0) {
                paletten = parseFallback(text);
            }

            if (paletten.length > 0) {
                for (const p of paletten) {
                    inventur[p.palettenart] = (inventur[p.palettenart] || 0) + p.anzahl;
                }
                speichereInventur();
                aktualisiereAnzeige();

                const details = paletten.map(p => `+${p.anzahl} ${p.palettenart}`).join(', ');
                zeigeToast('✅ ' + details, 'success');
            } else {
                zeigeToast('❓ Nicht erkannt: „' + text + '"', 'error');
            }

            isProcessing = false;
            setzeMicStatus('idle');
            setzeStatus('Tippe um zu sprechen');
        }

        // Ausgeschriebene Zahlen (Deutsch)
        const ZAHLWOERTER = {
            'ein': 1, 'eine': 1, 'einer': 1, 'eins': 1,
            'zwei': 2, 'drei': 3, 'vier': 4, 'fünf': 5,
            'sechs': 6, 'sieben': 7, 'acht': 8, 'neun': 9, 'zehn': 10,
            'elf': 11, 'zwölf': 12, 'dreizehn': 13, 'vierzehn': 14,
            'fünfzehn': 15, 'sechzehn': 16, 'siebzehn': 17, 'achtzehn': 18,
            'neunzehn': 19, 'zwanzig': 20, 'dreißig': 30, 'vierzig': 40,
            'fünfzig': 50, 'sechzig': 60, 'siebzig': 70, 'achtzig': 80,
            'neunzig': 90, 'hundert': 100
        };

        function findeZahl(ctx) {
            // Zuerst Ziffern suchen
            const m = ctx.match(/\b(\d+)\b/);
            if (m) return parseInt(m[1]);
            // Dann Zahlwörter
            for (const [wort, zahl] of Object.entries(ZAHLWOERTER)) {
                if (ctx.includes(wort)) return zahl;
            }
            return null;
        }

        // Lokaler Fallback ohne Netz
        function parseFallback(text) {
            const results = [];
            const lower = text.toLowerCase();

            for (const [syn, art] of Object.entries(SYNONYME)) {
                const idx = lower.indexOf(syn);
                if (idx === -1) continue;

                // Suche Zahl in ±40 Zeichen um das Synonym
                const start = Math.max(0, idx - 40);
                const end = Math.min(lower.length, idx + syn.length + 40);
                const ctx = lower.substring(start, end);
                const anzahl = findeZahl(ctx);

                if (anzahl && anzahl > 0 && !results.find(r => r.palettenart === art)) {
                    results.push({ palettenart: art, anzahl });
                }
            }
            return results;
        }

        // ============================================
        // EINTRAG BEARBEITEN
        // ============================================
        function bearbeiteEintrag(name) {
            const current = inventur[name] || 0;
            const eingabe = prompt(`${name}\nAktueller Wert: ${current}\n\nNeuer Wert eingeben (0 = löschen):`, current);
            if (eingabe === null) return;
            const wert = parseInt(eingabe);
            if (isNaN(wert) || wert < 0) return;

            if (wert === 0) {
                delete inventur[name];
                zeigeToast(`🗑️ ${name} entfernt`);
            } else {
                inventur[name] = wert;
                zeigeToast(`✅ ${name}: ${wert}`, 'success');
            }
            speichereInventur();
            aktualisiereAnzeige();
        }

        // ============================================
        // ZUSAMMENFASSUNG
        // ============================================
        function zeigeSummary() {
            const eintraege = Object.entries(inventur)
                .filter(([, v]) => v > 0)
                .sort((a, b) => b[1] - a[1]);

            const summaryListe = document.getElementById('summaryListe');
            const summarySubtitle = document.getElementById('summarySubtitle');

            if (eintraege.length === 0) {
                summaryListe.innerHTML = '<div class="empty-state">Noch nichts gezählt</div>';
                summarySubtitle.textContent = '';
            } else {
                const total = eintraege.reduce((s, [, v]) => s + v, 0);
                summarySubtitle.textContent = `${eintraege.length} Arten · ${total} Paletten`;

                summaryListe.innerHTML =
                    eintraege.map(([name, count]) => `
                        <div class="summary-row">
                            <span class="summary-name">${escapeHtml(name)}</span>
                            <span class="summary-count">${count}</span>
                        </div>
                    `).join('') +
                    `<div class="total-row">
                        <span class="total-label">GESAMT</span>
                        <span class="total-count">${total}</span>
                    </div>`;
            }

            document.getElementById('summaryOverlay').classList.add('visible');
        }

        function schliesseSummary() {
            document.getElementById('summaryOverlay').classList.remove('visible');
        }

        function kopiereErgebnis() {
            const eintraege = Object.entries(inventur)
                .filter(([, v]) => v > 0)
                .sort((a, b) => b[1] - a[1]);

            if (eintraege.length === 0) {
                zeigeToast('Keine Daten', 'error');
                return;
            }

            const datum = new Date().toLocaleDateString('de-DE');
            const total = eintraege.reduce((s, [, v]) => s + v, 0);
            const text = `Paletten Inventur – ${datum}\n\n` +
                eintraege.map(([n, c]) => `${n}: ${c}`).join('\n') +
                `\n\nGesamt: ${total}`;

            const doKopieren = () => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                zeigeToast('✅ Kopiert', 'success');
            };

            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => zeigeToast('✅ In Zwischenablage kopiert', 'success'))
                    .catch(doKopieren);
            } else {
                doKopieren();
            }
        }

        // ============================================
        // MANUELLE EINGABE
        // ============================================
        function fuelleDropdown() {
            const sel = document.getElementById('manualType');
            sel.innerHTML = '<option value="">-- Bitte wählen --</option>' +
                PALETTENARTEN.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
        }

        function oeffneManual() {
            document.getElementById('manualType').value = '';
            document.getElementById('manualQty').value = '1';
            setAction('add');
            document.getElementById('manualOverlay').classList.add('visible');
        }

        function schliesseManual() {
            document.getElementById('manualOverlay').classList.remove('visible');
        }

        function setAction(action) {
            manualAction = action;
            document.getElementById('actionAdd').className = 'action-btn' + (action === 'add' ? ' active-add' : '');
            document.getElementById('actionRemove').className = 'action-btn' + (action === 'remove' ? ' active-remove' : '');
        }

        function speichereManual() {
            const typ = document.getElementById('manualType').value;
            const qty = parseInt(document.getElementById('manualQty').value);

            if (!typ) { zeigeToast('❌ Bitte Palettenart wählen', 'error'); return; }
            if (!qty || qty <= 0) { zeigeToast('❌ Ungültige Anzahl', 'error'); return; }

            if (manualAction === 'add') {
                inventur[typ] = (inventur[typ] || 0) + qty;
                zeigeToast(`✅ +${qty} ${typ}`, 'success');
            } else {
                const neu = (inventur[typ] || 0) - qty;
                if (neu <= 0) { delete inventur[typ]; } else { inventur[typ] = neu; }
                zeigeToast(`✅ -${qty} ${typ}`, 'success');
            }

            speichereInventur();
            aktualisiereAnzeige();
            schliesseManual();
        }

        // ============================================
        // NEUE INVENTUR
        // ============================================
        function neueInventur() {
            const arten = Object.keys(inventur).length;
            if (arten === 0) return;

            if (confirm(`Alle ${arten} Einträge löschen und neu starten?`)) {
                inventur = {};
                speichereInventur();
                aktualisiereAnzeige();
                zeigeToast('🆕 Neue Inventur gestartet', 'success');
            }
        }

        // ============================================
        // INIT
        // ============================================
        fuelleDropdown();
        ladeInventur();
    </script>
</body>
</html>
